<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="东方妖々梦 Perfect Cherry Blossom Web 复刻，使用原作关卡数据与静态资源。" />
    <meta name="theme-color" content="#050509" />
    <title>东方妖々梦 ～ Perfect Cherry Blossom Web</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/th07.css" />
    <style>
      #bgmToggle,#exitArcade{position:fixed;top:10px;z-index:30;border:1px solid rgba(255,255,255,.22);
        background:rgba(8,8,16,.62);color:#f0eaff;border-radius:999px;padding:5px 12px;
        font:12px/1.2 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;cursor:pointer;
        -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
      #bgmToggle{right:10px}
      #exitArcade{left:10px}
      #bgmToggle:hover,#exitArcade:hover{border-color:rgba(255,255,255,.45)}
      #bgmToggle.off{opacity:.55}
      #audioHint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:25;
        padding:6px 14px;border-radius:999px;background:rgba(8,8,16,.62);border:1px solid rgba(255,255,255,.18);
        color:#f0eaff;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
        pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
      #audioHint.hidden{display:none}
      #audioGate{position:fixed;inset:0;z-index:26;display:flex;align-items:center;justify-content:center;
        background:rgba(3,3,8,.28);cursor:pointer;}
      #audioGate.hidden{display:none}
      #audioGate span{padding:10px 20px;border-radius:999px;background:rgba(10,9,20,.82);
        border:1px solid rgba(255,220,245,.32);color:#fff1f7;
        font:14px/1.4 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
        box-shadow:0 0 30px rgba(255,110,177,.22);}
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game" width="640" height="480"></canvas></div>
    <button id="exitArcade" type="button">← 退出街机</button>
    <button id="bgmToggle" type="button" aria-label="开关背景音乐">♪ 音乐 开</button>
    <div id="audioHint">点击画面任意处开启音乐</div>
    <div id="audioGate"><span>♪ 点击任意处开启音乐</span></div>
    <script defer src="dist/th07.js"></script>
    <script>
      (function () {
        var btn = document.getElementById('bgmToggle');
        var exitBtn = document.getElementById('exitArcade');
        var hint = document.getElementById('audioHint');
        var gate = document.getElementById('audioGate');
        var KEY = 'th07_bgm_muted';
        var muted = false;
        try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}
        function label() {
          btn.textContent = muted ? '♪ 音乐 关' : '♪ 音乐 开';
          btn.classList.toggle('off', muted);
        }
        function sync() {
          var a = window.__TH07_AUDIO__;
          if (a && a.setMuted) a.setMuted(muted);
        }
        function forceUnlock() {
          try {
            var a = window.__TH07_AUDIO__;
            if (a && a.unlock) a.unlock();
          } catch (e) {}
        }
        function retry() {
          if (window.__TH07_AUDIO__ && window.__TH07_AUDIO__.setMuted) sync();
          else setTimeout(retry, 120);
        }
        function hideHint() {
          var a = window.__TH07_AUDIO__;
          if (a && a.unlocked) {
            hint.classList.add('hidden');
            gate.classList.add('hidden');
          } else {
            setTimeout(hideHint, 200);
          }
        }
        label();
        retry();
        hideHint();
        document.addEventListener('pointerdown', forceUnlock, true);
        document.addEventListener('keydown', forceUnlock, true);
        gate.addEventListener('pointerdown', function () {
          forceUnlock();
          // 解锁失败也不要卡住游戏；0.4 秒后收起遮罩，底部提示保留
          setTimeout(function () { gate.classList.add('hidden'); }, 400);
        });
        btn.onclick = function () {
          muted = !muted;
          try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
          label();
          forceUnlock();
          sync();
        };
        if (window.parent === window) exitBtn.style.display = 'none';
        else {
          exitBtn.addEventListener('click', function () {
            try { window.parent.postMessage({ type: 'th07:exit' }, '*'); } catch (e) {}
          });
        }
      })();
    </script>
  </body>
</html>
