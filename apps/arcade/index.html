register({
  id:'fifteen', name:'数字华容道', icon:'🧮', tags:['益智'],
  mount: function(stage, api){
    var wrap = ce('div','');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;flex-shrink:0';
    var bar = ce('div','diffbar');
    var grid = ce('div','fif-grid');
    wrap.appendChild(bar);
    wrap.appendChild(grid);
    stage.appendChild(wrap);

    var DIFFS = [{name:'3×3', n:3}, {name:'4×4', n:4}, {name:'5×5', n:5}];
    var cur = 1;
    var n = 4;
    var board = [];
    var emptyIdx = 0;
    var moves = 0, elapsed = 0, timerId = null, won = false;

    DIFFS.forEach(function(d, i){
      var b = ce('button', i===1 ? 'on' : '', d.name);
      b.onclick = function(){
        cur = i;
        Array.prototype.forEach.call(bar.children, function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        reset();
      };
      bar.appendChild(b);
    });

    function reset(){
      n = DIFFS[cur].n;
      var total = n*n;
      board = [];
      for (var i=1;i<total;i++) board.push(i);
      board.push(0);
      emptyIdx = total-1;

      // 随机移动打乱（保证可解）
      for (var k=0;k<300;k++){
        var nb = neighbors(emptyIdx);
        var m = nb[rnd(0, nb.length-1)];
        board[emptyIdx] = board[m];
        board[m] = 0;
        emptyIdx = m;
      }

      moves = 0; elapsed = 0; won = false;
      if (timerId) clearInterval(timerId);
      timerId = setInterval(function(){
        if (!won){ elapsed += 1000; api.hud(moves, fmtTime(elapsed)); }
      }, 1000);

      render();
      api.hud(0, fmtTime(0));
    }

    function neighbors(i){
      var r = Math.floor(i/n), c = i % n;
      var out = [];
      if (r > 0) out.push(i-n);
      if (r < n-1) out.push(i+n);
      if (c > 0) out.push(i-1);
      if (c < n-1) out.push(i+1);
      return out;
    }

    function render(){
      grid.innerHTML = '';
      var size = Math.min(stage.clientWidth - 24, stage.clientHeight - 100, 440);
      var gap = 6;
      var cell = (size - gap*(n-1)) / n;
      grid.style.gridTemplateColumns = 'repeat('+n+','+cell+'px)';
      grid.style.gridTemplateRows = 'repeat('+n+','+cell+'px)';
      grid.style.gap = gap+'px';

      for (var i=0;i<board.length;i++){
        var v = board[i];
        var t = ce('div', 'fif-tile' + (v === 0 ? ' empty' : ''));
        if (v > 0){
          t.textContent = v;
          if (v === i+1) t.classList.add('ok');
          (function(idx){
            t.onclick = function(){ tryMove(idx); };
          })(i);
        }
        t.style.width = cell + 'px';
        t.style.height = cell + 'px';
        grid.appendChild(t);
      }
    }

    function tryMove(i){
      if (won) return;
      if (neighbors(emptyIdx).indexOf(i) < 0) return;
      board[emptyIdx] = board[i];
      board[i] = 0;
      emptyIdx = i;
      moves++;
      api.hud(moves, fmtTime(elapsed));
      render();
      checkWin();
    }

    function checkWin(){
      for (var i=0;i<board.length-1;i++){
        if (board[i] !== i+1) return;
      }
      won = true;
      if (timerId) clearInterval(timerId);
      api.finish(Math.max(1, 3000 - moves*10 - Math.floor(elapsed/1000)*5), '完成');
      setTimeout(function(){
        alert('恭喜完成！步数 ' + moves + '，用时 ' + fmtTime(elapsed));
      }, 200);
    }

    api.onRestart(reset);
    api.on(window, 'resize', render);

    reset();
  }
});

register({
  id:'linklink', name:'连连看', icon:'🀄', tags:['益智'],
  mount: function(stage, api){
    var wrap = ce('div','ll-wrap');
    var gridEl = ce('div','ll-grid');
    var cvs = ce('canvas','ll-canvas');
    wrap.appendChild(gridEl);
    wrap.appendChild(cvs);
    stage.appendChild(wrap);

    var W = 8, H = 6;
    var board = [];
    var cells = [];
    var sel = null;
    var score = 0, remaining = 0;
    var timeLeft = 120, timerId = null, paused = false, over = false;
    var reshuffleTries = 0;
    var ctx = null;

    var KINDS = ['🍎','🍇','🍉','🍓','🍒','🍑','🥝','🍍','🥥','🍋','🍊','🍌'];

    function reset(){
      wrap.style.width = Math.min(stage.clientWidth - 16, 460) + 'px';
      wrap.style.height = (Math.min(stage.clientWidth - 16, 460) * H / W) + 'px';

      var total = W*H;
      var pairs = total / 2;
      var pool = [];
      for (var i=0;i<pairs;i++) pool.push(KINDS[i % KINDS.length]);
      pool = pool.concat(pool);
      shuffleArr(pool);

      board = [];
      for (var r=0;r<H;r++){
        var row = [];
        for (var c=0;c<W;c++) row.push(pool[r*W+c]);
        board.push(row);
      }

      remaining = total;
      score = 0;
      sel = null;
      over = false; paused = false;
      reshuffleTries = 0;
      timeLeft = 120;
      if (timerId) clearInterval(timerId);
      timerId = setInterval(function(){
        if (paused || over) return;
        timeLeft--;
        if (timeLeft <= 0){ timeLeft = 0; endGame(false); }
        api.hud(score, '⏱ ' + timeLeft + 's');
      }, 1000);

      buildGrid();
      api.hud(0, '⏱ 120s');

      if (!hasMove()) reshuffle();
    }

    function buildGrid(){
      gridEl.innerHTML = '';
      var w = wrap.clientWidth, h = wrap.clientHeight;
      var cellW = (w - 3*(W-1)) / W;
      var cellH = (h - 3*(H-1)) / H;
      gridEl.style.gridTemplateColumns = 'repeat('+W+',1fr)';
      gridEl.style.gridTemplateRows = 'repeat('+H+',1fr)';
      gridEl.style.gap = '3px';

      cells = [];
      for (var r=0;r<H;r++){
        var row = [];
        for (var c=0;c<W;c++){
          var el = ce('div','ll-cell', board[r][c]);
          el.style.fontSize = Math.floor(Math.min(cellW, cellH) * 0.6) + 'px';
          (function(rr, cc, e){
            e.onclick = function(){ click(rr, cc); };
          })(r, c, el);
          gridEl.appendChild(el);
          row.push(el);
        }
        cells.push(row);
      }

      // canvas 尺寸
      cvs.width = w; cvs.height = h;
      ctx = cvs.getContext('2d');
    }

    function click(r, c){
      if (paused || over) return;
      if (!board[r][c]) return;

      if (sel && sel.r === r && sel.c === c){
        cells[r][c].classList.remove('sel');
        sel = null;
        return;
      }

      if (!sel){
        sel = { r:r, c:c };
        cells[r][c].classList.add('sel');
        return;
      }

      if (board[sel.r][sel.c] !== board[r][c]){
        cells[sel.r][sel.c].classList.remove('sel');
        sel = { r:r, c:c };
        cells[r][c].classList.add('sel');
        return;
      }

      var path = findPath(sel.r, sel.c, r, c);
      if (path){
        drawPath(path);
        var a = sel;
        cells[a.r][a.c].classList.remove('sel');
        board[a.r][a.c] = 0;
        board[r][c] = 0;
        cells[a.r][a.c].classList.add('gone');
        cells[r][c].classList.add('gone');
        remaining -= 2;
        score += 10;
        api.hud(score, '⏱ ' + timeLeft + 's');
        sel = null;

        if (remaining === 0){ endGame(true); return; }

        setTimeout(function(){
          if (!hasMove() && !over){
            reshuffle();
          }
        }, 260);
      } else {
        cells[sel.r][sel.c].classList.remove('sel');
        sel = { r:r, c:c };
        cells[r][c].classList.add('sel');
      }
    }

    function endGame(win){
      over = true;
      if (timerId) clearInterval(timerId);
      if (win){
        score += timeLeft * 5;
        api.finish(score, '通关');
        setTimeout(function(){ alert('恭喜通关！得分 ' + score); }, 100);
      } else {
        api.finish(score, '时间到');
        setTimeout(function(){ alert('时间到！得分 ' + score); }, 100);
      }
    }

    /* ---- 寻路：最多两次转折 ---- */
    function findPath(r1, c1, r2, c2){
      var ok = function(c, r){
        // 只允许棋盘外紧贴的一圈作为通路，避免无限向外扩展导致浏览器卡死
        if (c < -1 || c > W || r < -1 || r > H) return false;
        if (c === -1 || c === W || r === -1 || r === H) return true;
        if (c === c1 && r === r1) return true;
        if (c === c2 && r === r2) return true;
        return board[r][c] === 0;
      };

      var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      // 状态: (c, r, dir) -> 转弯数
      var best = {};
      var queue = [];

      function key(c, r, d){ return c + ',' + r + ',' + d; }

      for (var d=0;d<4;d++){
        var nc = c1 + dirs[d][0], nr = r1 + dirs[d][1];
        if (!ok(nc, nr)) continue;
        best[key(nc,nr,d)] = 0;
        queue.push({ c:nc, r:nr, d:d, turns:0, path:[[c1,r1],[nc,nr]] });
      }

      while (queue.length){
        queue.sort(function(a,b){ return a.turns - b.turns; });
        var cur = queue.shift();
        if (cur.c === c2 && cur.r === r2){
          return cur.path;
        }
        for (var dd=0;dd<4;dd++){
          var nx = cur.c + dirs[dd][0], ny = cur.r + dirs[dd][1];
          if (!ok(nx, ny)) continue;
          var nt = cur.turns + (dd === cur.d ? 0 : 1);
          if (nt > 2) continue;
          var k = key(nx, ny, dd);
          if (best[k] !== undefined && best[k] <= nt) continue;
          best[k] = nt;
          queue.push({ c:nx, r:ny, d:dd, turns:nt, path: cur.path.concat([[nx,ny]]) });
        }
      }
      return null;
    }

    function drawPath(path){
      if (!ctx) return;
      var w = cvs.width, h = cvs.height;
      var cw = (w - 3*(W-1)) / W;
      var ch = (h - 3*(H-1)) / H;
      var pts = path.map(function(p){
        return {
          x: p[0] * (cw + 3) + cw/2,
          y: p[1] * (ch + 3) + ch/2
        };
      });
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = '#3df0c8';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#3df0c8';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      setTimeout(function(){ if (ctx) ctx.clearRect(0,0,w,h); }, 300);
    }

    function hasMove(){
      for (var r1=0;r1<H;r1++){
        for (var c1=0;c1<W;c1++){
          if (!board[r1][c1]) continue;
          for (var r2=0;r2<H;r2++){
            for (var c2=0;c2<W;c2++){
              if (r1 === r2 && c1 === c2) continue;
              if (board[r1][c1] !== board[r2][c2]) continue;
              if (findPath(r1, c1, r2, c2)) return true;
            }
          }
        }
      }
      return false;
    }

    function reshuffle(){
      // 收集剩余图案
      var vals = [];
      for (var r=0;r<H;r++) for (var c=0;c<W;c++) if (board[r][c]) vals.push(board[r][c]);
      shuffleArr(vals);
      var k = 0;
      for (var r2=0;r2<H;r2++) for (var c2=0;c2<W;c2++){
        if (board[r2][c2]) board[r2][c2] = vals[k++];
      }
      // 重新渲染文字
      for (var r3=0;r3<H;r3++) for (var c3=0;c3<W;c3++){
        if (board[r3][c3]){
          cells[r3][c3].textContent = board[r3][c3];
          cells[r3][c3].classList.remove('gone');
        }
      }
      sel = null;
      // 如果仍然无解，最多重排 20 次，避免无限递归
      if (!hasMove()) {
        if (reshuffleTries++ < 20) setTimeout(reshuffle, 50);
      } else {
        reshuffleTries = 0;
      }
    }

    api.onPause(function(){
      if (over) return;
      paused = !paused;
      if (paused) alert('已暂停（点击确定继续）');
    });
    api.onRestart(reset);
    api.on(window, 'resize', function(){
      wrap.style.width = Math.min(stage.clientWidth - 16, 460) + 'px';
      wrap.style.height = (Math.min(stage.clientWidth - 16, 460) * H / W) + 'px';
      buildGrid();
    });

    requestAnimationFrame(function(){ reset(); });
  }
});

/* ======================= 12. 五子棋 ======================= */
register({
  id:'gomoku', name:'五子棋', icon:'⚫', tags:['对弈'],
  mount: function(stage, api){
    var wrap = ce('div','canvas-wrap');
    var cvs = ce('canvas');
    wrap.appendChild(cvs);
    stage.appendChild(wrap);

    var LW = 540, LH = 540;
    var ctx = setupCanvas(cvs, LW, LH);
    var overlay = makeOverlay(wrap);

    var N = 15;
    var PAD = 26;
    var CELL = (LW - PAD*2) / (N-1);
    var board;
    var turn = 1; // 1=玩家黑, 2=AI白
    var over = false, winLine = null;
    var aiLevel = 1; // 0简单 1普通 2困难
    var aiThinking = false;

    var difbar = ce('div','diffbar');
    ['简单','普通','困难'].forEach(function(name, i){
      var b = ce('button', i===1 ? 'on' : '', name);
      b.onclick = function(){
        aiLevel = i;
        Array.prototype.forEach.call(difbar.children, function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        reset();
      };
      difbar.appendChild(b);
    });
    stage.insertBefore(difbar, stage.firstChild);

    function reset(){
      board = [];
      for (var r=0;r<N;r++){
        var row = [];
        for (var c=0;c<N;c++) row.push(0);
        board.push(row);
      }
      turn = 1;
      over = false; winLine = null; aiThinking = false;
      overlay.hide();
      api.hud(0, '你的回合');
      draw();
    }

    function inb(x,y){ return x>=0 && x<N && y>=0 && y<N; }

    function checkWin(r, c, p){
      var dirs = [[1,0],[0,1],[1,1],[1,-1]];
      for (var i=0;i<dirs.length;i++){
        var dx = dirs[i][0], dy = dirs[i][1];
        var line = [{x:c,y:r}];
        for (var s=1;s<5;s++){
          var nx = c + dx*s, ny = r + dy*s;
          if (!inb(nx,ny) || board[ny][nx] !== p) break;
          line.push({x:nx,y:ny});
        }
        for (var s2=1;s2<5;s2++){
          var nx2 = c - dx*s2, ny2 = r - dy*s2;
          if (!inb(nx2,ny2) || board[ny2][nx2] !== p) break;
          line.unshift({x:nx2,y:ny2});
        }
        if (line.length >= 5) return line.slice(0, 5);
      }
      return null;
    }

    function gameOver(winner){
      over = true;
      if (winner === 1){
        api.finish(100, '你赢了');
        overlay.show('<h2>🎉 你赢了！</h2><p>再来一局？</p>'
          + '<button class="btn" id="gomokuAgain">再来一局</button>');
      } else if (winner === 2){
        api.finish(0, 'AI 获胜');
        overlay.show('<h2>AI 获胜</h2><p>再接再厉</p>'
          + '<button class="btn" id="gomokuAgain">再来一局</button>');
      } else {
        overlay.show('<h2>平局</h2><p>棋盘已满</p>'
          + '<button class="btn" id="gomokuAgain">再来一局</button>');
      }
      var btn = overlay.querySelector('#gomokuAgain');
      if (btn) btn.onclick = reset;
    }

    function place(r, c, p){
      board[r][c] = p;
      var line = checkWin(r, c, p);
      if (line){
        winLine = line;
        draw();
        gameOver(p);
        return true;
      }
      // 平局
      var full = true;
      for (var i=0;i<N && full;i++) for (var j=0;j<N;j++) if (!board[i][j]){ full = false; break; }
      if (full){ draw(); gameOver(0); return true; }
      return false;
    }

    /* ---------- AI ---------- */
    function evalDir(r, c, dx, dy, p){
      var count = 1, open = 0;
      for (var s=1;s<5;s++){
        var nr = r + dy*s, nc = c + dx*s;
        if (!inb(nc,nr)) break;
        if (board[nr][nc] === p){ count++; }
        else { if (board[nr][nc] === 0) open++; break; }
      }
      for (var s2=1;s2<5;s2++){
        var nr2 = r - dy*s2, nc2 = c - dx*s2;
        if (!inb(nc2,nr2)) break;
        if (board[nr2][nc2] === p){ count++; }
        else { if (board[nr2][nc2] === 0) open++; break; }
      }
      return { count: count, open: open };
    }

    function scorePoint(r, c, p){
      var dirs = [[1,0],[0,1],[1,1],[1,-1]];
      var total = 0;
      for (var i=0;i<dirs.length;i++){
        var e = evalDir(r, c, dirs[i][0], dirs[i][1], p);
        var sc = 0;
        if (e.count >= 5) sc = 1000000;
        else if (e.count === 4) sc = e.open >= 2 ? 100000 : (e.open === 1 ? 12000 : 0);
        else if (e.count === 3) sc = e.open >= 2 ? 6000 : (e.open === 1 ? 600 : 0);
        else if (e.count === 2) sc = e.open >= 2 ? 300 : (e.open === 1 ? 60 : 0);
        else if (e.count === 1) sc = e.open >= 2 ? 20 : 5;
        total += sc;
      }
      return total;
    }

    function aiMove(){
      var bestScore = -1;
      var candidates = [];
      for (var r=0;r<N;r++){
        for (var c=0;c<N;c++){
          if (board[r][c]) continue;
          // 只考虑已有棋子附近的点
          var near = false;
          for (var dr=-2;dr<=2 && !near;dr++){
            for (var dc=-2;dc<=2;dc++){
              var nr = r+dr, nc = c+dc;
              if (inb(nc,nr) && board[nr][nc]){ near = true; break; }
            }
          }
          if (!near && r !== 7 && c !== 7) continue;

          var atk = scorePoint(r, c, 2);
          var def = scorePoint(r, c, 1);
          var w = aiLevel === 2 ? 1.25 : (aiLevel === 1 ? 1.1 : 0.8);
          var sc = atk + def * w;
          // 加一点随机，避免死板
          sc += Math.random() * (aiLevel === 0 ? 800 : 20);

          if (sc > bestScore){
            bestScore = sc;
            candidates = [{r:r,c:c}];
          } else if (sc === bestScore){
            candidates.push({r:r,c:c});
          }
        }
      }
      if (!candidates.length) return null;
      return candidates[rnd(0, candidates.length-1)];
    }

    function aiTurn(){
      if (over) return;
      aiThinking = true;
      api.hud(0, 'AI 思考中…');
      setTimeout(function(){
        if (over){ aiThinking = false; return; }
        var mv = aiMove();
        aiThinking = false;
        if (!mv){ gameOver(0); return; }
        var won = place(mv.r, mv.c, 2);
        draw();
        if (!won){
          turn = 1;
          api.hud(0, '你的回合');
        }
      }, 320);
    }

    /* ---------- 绘制 ---------- */
    function draw(){
      ctx.fillStyle = '#151a2e';
      ctx.fillRect(0,0,LW,LH);

      // 棋盘纹理
      ctx.fillStyle = 'rgba(255,255,255,.02)';
      ctx.fillRect(PAD-8, PAD-8, LW-PAD*2+16, LH-PAD*2+16);

      // 网格
      ctx.strokeStyle = 'rgba(255,255,255,.22)';
      ctx.lineWidth = 1;
      for (var i=0;i<N;i++){
        var p = PAD + i*CELL;
        ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(LW-PAD, p); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, LH-PAD); ctx.stroke();
      }

      // 星位
      var stars = [[3,3],[3,11],[11,3],[11,11],[7,7]];
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      stars.forEach(function(s){
        ctx.beginPath();
        ctx.arc(PAD + s[0]*CELL, PAD + s[1]*CELL, 3, 0, Math.PI*2);
        ctx.fill();
      });

      // 棋子
      for (var r=0;r<N;r++){
        for (var c=0;c<N;c++){
          if (!board[r][c]) continue;
          var x = PAD + c*CELL, y = PAD + r*CELL;
          var rad = CELL*0.42;
          if (board[r][c] === 1){
            ctx.fillStyle = '#0a0e1c';
            ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.15)';
            ctx.lineWidth = 1;
            ctx.stroke();
          } else {
            ctx.fillStyle = '#f0f3ff';
            ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.2)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      // 胜利连线
      if (winLine){
        ctx.strokeStyle = '#ffcc44';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ffcc44';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        var a = winLine[0], b = winLine[winLine.length-1];
        ctx.moveTo(PAD + a.x*CELL, PAD + a.y*CELL);
        ctx.lineTo(PAD + b.x*CELL, PAD + b.y*CELL);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // 输入
    api.on(cvs, 'pointerdown', function(e){
      if (over || aiThinking || turn !== 1) return;
      e.preventDefault();
      var p = toLocal(cvs, e, LW, LH);
      var c = Math.round((p.x - PAD) / CELL);
      var r = Math.round((p.y - PAD) / CELL);
      if (!inb(c,r)) return;
      if (board[r][c]) return;
      var won = place(r, c, 1);
      draw();
      if (!won){
        turn = 2;
        api.hud(0, 'AI 回合');
        aiTurn();
      }
    });
    api.on(cvs, 'touchmove', function(e){ e.preventDefault(); }, {passive:false});

    api.onRestart(reset);

    function layout(){ layoutCanvas(cvs, wrap, LW, LH); }
    api.on(window, 'resize', layout);
    requestAnimationFrame(layout);

    reset();
  }
});

/* ======================= 13. 井字棋 ======================= */
register({
  id:'tictactoe', name:'井字棋', icon:'❌', tags:['对弈'],
  mount: function(stage, api){
    var wrap = ce('div','');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;flex-shrink:0';
    var bar = ce('div','diffbar');
    var grid = ce('div','ttt-grid');
    wrap.appendChild(bar);
    wrap.appendChild(grid);
    stage.appendChild(wrap);

    var DIFFS = ['简单','普通','无敌'];
    var level = 1;
    var board, over, winLine, wins = 0, draws = 0, losses = 0;

    DIFFS.forEach(function(name, i){
      var b = ce('button', i===1 ? 'on' : '', name);
      b.onclick = function(){
        level = i;
        Array.prototype.forEach.call(bar.children, function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        reset();
      };
      bar.appendChild(b);
    });

    function reset(){
      board = ['','','','','','','','',''];
      over = false; winLine = null;
      render();
      api.hud(0, '胜 '+wins+' 平 '+draws+' 负 '+losses);
    }

    function render(){
      grid.innerHTML = '';
      var size = Math.min(stage.clientWidth - 24, stage.clientHeight - 110, 380);
      var cell = (size - 16) / 3;
      grid.style.gridTemplateColumns = 'repeat(3,'+cell+'px)';
      grid.style.gridTemplateRows = 'repeat(3,'+cell+'px)';

      for (var i=0;i<9;i++){
        var v = board[i];
        var el = ce('div','ttt-cell' + (v ? (v === 'X' ? ' x' : ' o') : ''));
        if (winLine && winLine.indexOf(i) >= 0) el.classList.add('win');
        el.textContent = v;
        el.style.width = cell + 'px';
        el.style.height = cell + 'px';
        (function(idx, e){
          e.onclick = function(){ humanMove(idx); };
        })(i, el);
        grid.appendChild(el);
      }
    }

    function humanMove(i){
      if (over || board[i]) return;
      board[i] = 'X';
      var r = check();
      if (r){ finish(r); return; }
      render();
      setTimeout(aiMove, 180);
    }

    function aiMove(){
      if (over) return;
      var idx = chooseMove();
      if (idx < 0){ finish(null); return; }
      board[idx] = 'O';
      var r = check();
      if (r){ finish(r); return; }
      render();
    }

    function lines(){
      return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    }

    function check(){
      var L = lines();
      for (var i=0;i<L.length;i++){
        var a = L[i][0], b = L[i][1], c = L[i][2];
        if (board[a] && board[a] === board[b] && board[b] === board[c]){
          winLine = L[i];
          return board[a];
        }
      }
      if (board.every(function(x){ return x; })) return 'draw';
      return null;
    }

    function finish(r){
      over = true;
      render();
      var msg = '';
      if (r === 'X'){ wins++; msg = '你赢了！'; }
      else if (r === 'O'){ losses++; msg = '你输了'; }
      else { draws++; msg = '平局'; }
      api.hud(0, '胜 '+wins+' 平 '+draws+' 负 '+losses);
      api.finish(r === 'X' ? 100 : 0, msg);
      setTimeout(function(){
        alert(msg + '\n\n点击确定开始新一局');
        reset();
      }, 300);
    }

    function chooseMove(){
      // 空位
      var empty = [];
      for (var i=0;i<9;i++) if (!board[i]) empty.push(i);
      if (!empty.length) return -1;

      if (level === 0){
        // 简单：40% 随机
        if (Math.random() < 0.45) return empty[rnd(0, empty.length-1)];
        return bestMove();
      }
      if (level === 1){
        // 普通：有 20% 走次优
        if (Math.random() < 0.2){
          var scored = empty.map(function(i){
            board[i] = 'O';
            var s = minimax(board, 'X', 0);
            board[i] = '';
            return { i:i, s:s };
          });
          scored.sort(function(a,b){ return b.s - a.s; });
          return scored[Math.min(1, scored.length-1)].i;
        }
        return bestMove();
      }
      return bestMove();
    }

    function bestMove(){
      var best = -Infinity, bestIdx = -1;
      for (var i=0;i<9;i++){
        if (board[i]) continue;
        board[i] = 'O';
        var s = minimax(board, 'X', 0);
        board[i] = '';
        if (s > best){ best = s; bestIdx = i; }
      }
      return bestIdx;
    }

    function minimax(b, player, depth){
      var L = lines();
      for (var i=0;i<L.length;i++){
        var a = b[L[i][0]], bb = b[L[i][1]], c = b[L[i][2]];
        if (a && a === bb && bb === c){
          return a === 'O' ? (10 - depth) : (depth - 10);
        }
      }
      if (b.every(function(x){ return x; })) return 0;

      if (player === 'O'){
        var best = -Infinity;
        for (var j=0;j<9;j++){
          if (b[j]) continue;
          b[j] = 'O';
          var v = minimax(b, 'X', depth+1);
          b[j] = '';
          if (v > best) best = v;
        }
        return best;
      } else {
        var worst = Infinity;
        for (var k=0;k<9;k++){
          if (b[k]) continue;
          b[k] = 'X';
          var v2 = minimax(b, 'O', depth+1);
          b[k] = '';
          if (v2 < worst) worst = v2;
        }
        return worst;
      }
    }

    api.onRestart(reset);

    reset();
  }
});

/* ======================= 嵌入式桥接（共创工作室 · 游戏分区） =======================
 * 父页面通过 postMessage 控制起/停，本页把当前游戏状态回报给父页面。
 * 单独打开本文件时 EMBED 为 false，一切行为与原来完全一致。
 * =============================================================================== */
var EMBED = window.parent !== window;
if (EMBED) document.body.classList.add('is-embed');

function postToParent(msg){
  if (!EMBED) return;
  try { window.parent.postMessage(msg, '*'); } catch (e) {}
}

function currentId(){
  return (location.hash || '').replace(/^#\/?/, '');
}

function findGame(id){
  for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i];
  return null;
}

var routeBase = route;
route = function(){
  routeBase();
  var g = findGame(currentId());
  if (g) postToParent({ type: 'arcade:state', id: g.id, name: g.name, icon: g.icon });
  else postToParent({ type: 'arcade:state', id: '', name: '' });
};

window.addEventListener('message', function(ev){
  var d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'arcade:open' && d.id){
    if (!findGame(d.id)) return;
    if (currentId() === d.id) route();
    else location.hash = '#/' + d.id;
    window.focus();
  } else if (d.type === 'arcade:lobby'){
    location.hash = '';
    if (EMBED) window.parent.focus();
  }
});

/* Esc 交给父页面处理：退出全屏 / 收起街机屏 */
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && EMBED){
    e.preventDefault();
    postToParent({ type: 'arcade:escape' });
  }
}, true);

/* ======================= 扩展卡带：东方网页版 ======================= */
if (window.TOUHOU_GAME) register(window.TOUHOU_GAME());

/* ======================= 启动 ======================= */
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', function(){
  if (mounted) mounted.cleanup();
});
route();

})();
</script>
